name: Keep Supabase Alive

on:
  schedule:
    # Runs every 4 days at 12:00 UTC (well within 7-day pause window)
    - cron: '0 12 */4 * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          # The goal is only to prove the project is not paused. Any HTTP
          # response (even 401 Unauthorized) means the server is up, so we
          # don't need an API key. A paused or unreachable project returns
          # no response at all, which curl reports as status 000.
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 \
            "https://mprbbjgrshfbupheuscn.supabase.co/rest/v1/")
          echo "Supabase responded with: $STATUS"
          if [ "$STATUS" = "000" ]; then
            echo "ERROR: No response — project may be paused or unreachable"
            exit 1
          fi
          echo "Project is alive (HTTP $STATUS)"
